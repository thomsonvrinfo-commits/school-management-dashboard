
name = "schoolpulse-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "ff503ec121884690ad4cf73d37d48de6"
localConnectionString = "postgres://schoolpulse:schoolpulse@localhost:5432/schoolpulse"

[vars]
ENVIRONMENT = "development"
ALLOWED_ORIGIN = "http://localhost:5173"

[env.production]
name = "schoolpulse-api"
vars = { ENVIRONMENT = "production", ALLOWED_ORIGIN = "https://school-management-dashboard-final.pages.dev" }

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "ff503ec121884690ad4cf73d37d48de6"
